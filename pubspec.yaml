name: mobile_shop
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # Added for localization
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  firebase_analytics: ^11.0.0
  flutter_riverpod: ^2.4.0
  flutter_animate: ^4.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^2.4.0
  shared_preferences: ^2.2.0
  mobile_scanner: ^6.0.2
  fl_chart: ^0.70.0
  intl: any # Using 'any' to let flutter_localizations resolve the version
  flutter_local_notifications: ^18.0.1
  pdf: ^3.10.7
  path_provider: ^2.1.2
  share_plus: ^10.0.0
  url_launcher: ^6.1.7
  uuid: ^4.5.1
  get_it: ^8.0.3
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true # Enable generation of l10n files

